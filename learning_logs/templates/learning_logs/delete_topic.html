{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h1>Delete Topic?</h1>
{% endblock page_header %}

{% block content %}
  <p>Are you sure you want to delete the topic <strong>"{{ topic }}"</strong> and all its entries?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'learning_logs:topic' topic.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock content %}
